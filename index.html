<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siêu Xe VIP</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins';}
body{background:#050505;color:white;}

/* NAV */
nav{
position:fixed;width:100%;padding:15px 8%;
display:flex;justify-content:space-between;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
z-index:1000;
}
nav h2{color:#4da3ff;}

/* HERO */
.hero{
height:100vh;
background:url('https://images.unsplash.com/photo-1617814076367-b759c7d7e738') center/cover;
display:flex;align-items:center;justify-content:center;
text-align:center;position:relative;
}
.hero::after{
content:'';position:absolute;inset:0;
background:rgba(0,0,0,0.6);
}
.hero-content{position:relative;}
.hero h1{font-size:4rem;}

.btn{
padding:10px 25px;border:none;
background:#4da3ff;color:white;
border-radius:20px;cursor:pointer;
}

/* TAB */
.tabs{
display:flex;justify-content:center;
gap:20px;margin-top:30px;
}
.tab{
padding:10px 25px;
border:1px solid #4da3ff;
border-radius:20px;cursor:pointer;
}
.tab.active{background:#4da3ff;}

/* GRID */
section{padding:80px 10%;}
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
}

/* CARD */
.card{position:relative;border-radius:15px;overflow:hidden;cursor:pointer;}
.card img{width:100%;height:200px;object-fit:cover;transition:0.4s;}
.card:hover img{transform:scale(1.1);}
.overlay{
position:absolute;inset:0;
background:rgba(0,0,0,0.7);
display:flex;align-items:center;justify-content:center;
opacity:0;transition:0.3s;
}
.card:hover .overlay{opacity:1;}

/* DETAIL */
.detail{display:none;padding:100px 10%;}
video{width:100%;margin:20px 0;border-radius:15px;}
.specs{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}
.spec{
background:#111;padding:10px;border-radius:10px;
}
.back{color:#4da3ff;cursor:pointer;margin-bottom:20px;}

/* SURVEY */
.survey{
margin-top:40px;
background:#111;padding:20px;border-radius:15px;
}
input,select{
width:100%;padding:10px;margin:10px 0;
border:none;border-radius:10px;
}

/* FOOTER */
.footer{
background:#000;padding:40px 10%;
margin-top:40px;text-align:center;
}
</style>
</head>

<body>

<nav><h2>SuperCar</h2></nav>

<!-- HERO -->
<div class="hero" id="home">
<div class="hero-content">
<h1>Siêu Xe Đỉnh Cao</h1>
<br>
<button class="btn" onclick="scrollToCars()">Khám phá</button>
</div>
</div>

<!-- TAB -->
<div class="tabs">
<div class="tab active" onclick="showTab('car')">Ô tô</div>
<div class="tab" onclick="showTab('motor')">Motor</div>
</div>

<!-- Ô TÔ -->
<section id="carTab">
<div class="grid">

<div class="card" onclick="openDetail('bugatti')"><img src="https://upload.wikimedia.org/wikipedia/commons/1/18/Bugatti_Chiron_1.jpg"><div class="overlay">Bugatti</div></div>
<div class="card" onclick="openDetail('lambo')"><img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70"><div class="overlay">Lamborghini</div></div>
<div class="card" onclick="openDetail('ferrari')"><img src="https://images.unsplash.com/photo-1614200187524-dc4b892acf16"><div class="overlay">Ferrari</div></div>

<div class="card" onclick="openDetail('mclaren')"><img src="https://images.unsplash.com/photo-1590362891991-f776e747a588"><div class="overlay">McLaren</div></div>
<div class="card" onclick="openDetail('koenigsegg')"><img src="https://images.unsplash.com/photo-1617654112329-9c5f75f1a4bb"><div class="overlay">Jesko</div></div>
<div class="card" onclick="openDetail('porsche')"><img src="https://images.unsplash.com/photo-1583121274602-3e2820c69888"><div class="overlay">Porsche</div></div>

</div>
</section>

<!-- MOTOR -->
<section id="motorTab" style="display:none;">
<div class="grid">

<div class="card" onclick="openDetail('ducati')"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9"><div class="overlay">Ducati</div></div>
<div class="card" onclick="openDetail('bmw')"><img src="https://images.unsplash.com/photo-1580310614729-ccd69652491d"><div class="overlay">BMW</div></div>
<div class="card" onclick="openDetail('kawasaki')"><img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39"><div class="overlay">Kawasaki</div></div>

<div class="card" onclick="openDetail('yamaha')"><img src="https://images.unsplash.com/photo-1609630875171-b1321377ee65"><div class="overlay">Yamaha</div></div>
<div class="card" onclick="openDetail('honda')"><img src="https://images.unsplash.com/photo-1589391886645-d51941baf7fb"><div class="overlay">Honda</div></div>
<div class="card" onclick="openDetail('suzuki')"><img src="https://images.unsplash.com/photo-1611242320536-f12d3541249b"><div class="overlay">Suzuki</div></div>

</div>
</section>

<!-- DETAIL -->
<div class="detail" id="detailPage">
<div class="back" onclick="goHome()">⬅ Quay lại</div>

<h1 id="dName"></h1>
<p id="dDesc"></p>

<video id="dVideo" controls></video>

<div class="specs" id="specs"></div>

<a id="buyLink" target="_blank">
<button class="btn">Mua ngay</button>
</a>

<div class="survey">
<h3>Khảo sát sở thích</h3>
<input placeholder="Tên của bạn">
<select>
<option>Loại xe</option>
<option>Ô tô</option>
<option>Motor</option>
</select>
<select>
<option>Hãng yêu thích</option>
<option>Ferrari</option>
<option>Lamborghini</option>
<option>Bugatti</option>
</select>
<button class="btn">Gửi</button>
</div>

</div>

<footer class="footer">
© 2026 SuperCar | Liên hệ: supercar@gmail.com
</footer>

<script>
function scrollToCars(){
document.getElementById("carTab").scrollIntoView({behavior:"smooth"});
}

function showTab(type){
carTab.style.display= type==="car"?"block":"none";
motorTab.style.display= type==="motor"?"block":"none";
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
event.target.classList.add("active");
}

const data={
bugatti:{name:"Bugatti Chiron",desc:"1500HP",video:"https://www.w3schools.com/html/mov_bbb.mp4",specs:{"HP":"1500"},link:"https://bugatti.com"},
lambo:{name:"Lamborghini Aventador",desc:"V12",video:"https://www.w3schools.com/html/movie.mp4",specs:{"HP":"770"},link:"https://lamborghini.com"},
ferrari:{name:"Ferrari SF90",desc:"Hybrid",video:"https://www.w3schools.com/html/mov_bbb.mp4",specs:{"HP":"1000"},link:"https://ferrari.com"},
mclaren:{name:"McLaren 720S",desc:"720HP",video:"https://www.w3schools.com/html/movie.mp4",specs:{"HP":"720"},link:"https://mclaren.com"},
koenigsegg:{name:"Jesko",desc:"1600HP",video:"https://www.w3schools.com/html/mov_bbb.mp4",specs:{"HP":"1600"},link:"https://koenigsegg.com"},
porsche:{name:"Porsche 911",desc:"640HP",video:"https://www.w3schools.com/html/movie.mp4",specs:{"HP":"640"},link:"https://porsche.com"},

ducati:{name:"Ducati Panigale V4",desc:"214HP",video:"https://www.w3schools.com/html/mov_bbb.mp4",specs:{"HP":"214"},link:"https://ducati.com"},
bmw:{name:"BMW S1000RR",desc:"205HP",video:"https://www.w3schools.com/html/movie.mp4",specs:{"HP":"205"},link:"https://bmw.com"},
kawasaki:{name:"Kawasaki H2R",desc:"310HP",video:"https://www.w3schools.com/html/mov_bbb.mp4",specs:{"HP":"310"},link:"https://kawasaki.com"},
yamaha:{name:"Yamaha R1",desc:"200HP",video:"https://www.w3schools.com/html/movie.mp4",specs:{"HP":"200"},link:"https://yamaha.com"},
honda:{name:"Honda CBR1000RR",desc:"189HP",video:"https://www.w3schools.com/html/mov_bbb.mp4",specs:{"HP":"189"},link:"https://honda.com"},
suzuki:{name:"Suzuki GSX-R1000",desc:"199HP",video:"https://www.w3schools.com/html/movie.mp4",specs:{"HP":"199"},link:"https://suzuki.com"}
};

function openDetail(id){
let car=data[id];
dName.innerText=car.name;
dDesc.innerText=car.desc;
dVideo.src=car.video;

let html="";
for(let k in car.specs){
html+=`<div class="spec">${k}: ${car.specs[k]}</div>`;
}
specs.innerHTML=html;

buyLink.href=car.link;

home.style.display="none";
carTab.style.display="none";
motorTab.style.display="none";
detailPage.style.display="block";
}

function goHome(){
home.style.display="flex";
carTab.style.display="block";
detailPage.style.display="none";
}
</script>

</body>
</html>
