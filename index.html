<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siêu Xe VIP của Dũng</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins';}
body{background:#050505;color:white;}

/* NAV */
nav{
position:fixed;width:100%;padding:15px 8%;
display:flex;justify-content:space-between;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
z-index:1000;
}
nav h2{color:#4da3ff;}

/* HERO */
.hero{
height:100vh;
background:url('https://images.unsplash.com/photo-1617814076367-b759c7d7e738') center/cover;
display:flex;align-items:center;justify-content:center;
text-align:center;position:relative;
}
.hero::after{
content:'';position:absolute;inset:0;
background:rgba(0,0,0,0.6);
}
.hero-content{position:relative;}
.hero h1{font-size:4rem;}

.btn{
padding:10px 25px;border:none;
background:#4da3ff;color:white;
border-radius:20px;cursor:pointer;
}

/* TAB */
.tabs{
display:flex;justify-content:center;
gap:20px;margin-top:30px;
}
.tab{
padding:10px 25px;
border:1px solid #4da3ff;
border-radius:20px;cursor:pointer;
}
.tab.active{background:#4da3ff;}

/* GRID */
section{padding:80px 10%;}
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
}

/* CARD */
.card{position:relative;border-radius:15px;overflow:hidden;cursor:pointer;}
.card img{width:100%;height:200px;object-fit:cover;transition:0.4s;}
.card:hover img{transform:scale(1.1);}
.overlay{
position:absolute;inset:0;
background:rgba(0,0,0,0.7);
display:flex;align-items:center;justify-content:center;
opacity:0;transition:0.3s;
}
.card:hover .overlay{opacity:1;}

/* DETAIL */
.detail{display:none;padding:100px 10%;}
.detail img{width:100%;border-radius:15px;margin-bottom:20px;}
video{width:100%;margin:20px 0;border-radius:15px;}
.specs{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}
.spec{
background:#111;padding:10px;border-radius:10px;
}
.back{color:#4da3ff;cursor:pointer;margin-bottom:20px;}

/* SURVEY */
.survey{
margin-top:40px;
background:#111;padding:20px;border-radius:15px;
}
input,select{
width:100%;padding:10px;margin:10px 0;
border:none;border-radius:10px;
}

/* FOOTER */
.footer{
background:#000;
padding:60px 10%;
margin-top:50px;
border-top:1px solid rgba(255,255,255,0.1);
}
.footer-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:30px;
}
.footer-box h3{color:#4da3ff;margin-bottom:15px;}
.footer-box p, .footer-box a{
font-size:0.9rem;margin:6px 0;opacity:0.8;color:white;
text-decoration:none;display:block;
}
.footer-box p:hover, .footer-box a:hover{
color:#4da3ff;transform:translateX(5px);
}

/* CREDIT */
.credit{text-align:center;margin-top:30px;}
.credit-name{
font-weight:700;font-size:1.2rem;color:#4da3ff;
text-shadow:0 0 10px #4da3ff;
}
</style>
</head>

<body>

<nav><h2>SuperCar</h2></nav>

<!-- HERO -->
<div class="hero" id="home">
<div class="hero-content">
<h1>Siêu Xe Đỉnh Cao</h1>
<br>
<button class="btn" onclick="scrollToCars()">Khám phá</button>
</div>
</div>

<!-- TAB -->
<div class="tabs">
<div class="tab active" onclick="showTab('car')">Ô tô</div>
<div class="tab" onclick="showTab('motor')">Motor</div>
</div>

<!-- Ô TÔ -->
<section id="carTab">
<div class="grid">
<div class="card" onclick="openDetail('bugatti')"><img src="https://upload.wikimedia.org/wikipedia/commons/1/18/Bugatti_Chiron_1.jpg"><div class="overlay">Bugatti</div></div>
<div class="card" onclick="openDetail('lambo')"><img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70"><div class="overlay">Lamborghini</div></div>
<div class="card" onclick="openDetail('ferrari')"><img src="https://images.unsplash.com/photo-1614200187524-dc4b892acf16"><div class="overlay">Ferrari</div></div>
<div class="card" onclick="openDetail('mclaren')"><img src="https://images.unsplash.com/photo-1590362891991-f776e747a588"><div class="overlay">McLaren</div></div>
<div class="card" onclick="openDetail('koenigsegg')"><img src="https://news.dupontregistry.com/cdn/shop/articles/Snapinsta.app_424480670_1773512393162429_5623901643462568802_n_1080.jpg?v=1767071160"><div class="overlay">Jesko</div></div>
<div class="card" onclick="openDetail('porsche')"><img src="https://images.unsplash.com/photo-1583121274602-3e2820c69888"><div class="overlay">Porsche</div></div>
</div>
</section>

<!-- MOTOR -->
<section id="motorTab" style="display:none;">
<div class="grid">
<div class="card" onclick="openDetail('ducati')"><img src="https://etimg.etb2bimg.com/photo/115017336.cms"><div class="overlay">Ducati</div></div>
<div class="card" onclick="openDetail('bmw')"><img src="https://images.unsplash.com/photo-1580310614729-ccd69652491d"><div class="overlay">BMW</div></div>
<div class="card" onclick="openDetail('kawasaki')"><img src="https://autopro8.mediacdn.vn/2021/11/3/h2r10-16359036006881712791251.jpeg"><div class="overlay">Kawasaki</div></div>
<div class="card" onclick="openDetail('yamaha')"><img src="https://images.unsplash.com/photo-1609630875171-b1321377ee65"><div class="overlay">Yamaha</div></div>
<div class="card" onclick="openDetail('honda')"><img src="https://i1-vnexpress.vnecdn.net/2023/04/13/Honda-CBR1000RR-R-Fireblade-2022-1.jpg?w=750"><div class="overlay">Honda</div></div>
<div class="card" onclick="openDetail('suzuki')"><img src="https://autopress.vn/uploads/userfiles/images/news_1537564497/Suzuki-GSX-R1000-Ryuyo-16.jpg"><div class="overlay">Suzuki</div></div>
</div>
</section>

<!-- DETAIL -->
<div class="detail" id="detailPage">
<div class="back" onclick="goHome()">⬅ Quay lại</div>

<img id="dImg">
<h1 id="dName"></h1>
<p id="dDesc"></p>

<video id="dVideo" controls></video>

<div class="specs" id="specs"></div>

<a id="buyLink" target="_blank">
<button class="btn">Mua ngay</button>
</a>
</div>

<!-- FOOTER -->
<footer class="footer">
<div class="footer-container">
<div class="footer-box">
<h3>Liên hệ</h3>
<p>📞 0987 654 321</p>
<p>📧 dungdz@gmail.com</p>
</div>
</div>

<div class="credit">
<div class="credit-name">👨‍💻 Trịnh Minh Dũng</div>
</div>
</footer>

<script>
function scrollToCars(){
document.getElementById("carTab").scrollIntoView({behavior:"smooth"});
}

function showTab(type){
carTab.style.display= type==="car"?"block":"none";
motorTab.style.display= type==="motor"?"block":"none";
}

const data={
bugatti:{name:"Bugatti Chiron",img:"https://upload.wikimedia.org/wikipedia/commons/1/18/Bugatti_Chiron_1.jpg",desc:"1500HP",video:"https://www.w3schools.com/html/mov_bbb.mp4",specs:{"HP":"1500"},link:"https://bugatti.com"},
lambo:{name:"Lamborghini Aventador",img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70",desc:"770HP",video:"https://www.w3schools.com/html/movie.mp4",specs:{"HP":"770"},link:"https://lamborghini.com"},
ferrari:{name:"Ferrari SF90",img:"https://images.unsplash.com/photo-1614200187524-dc4b892acf16",desc:"1000HP",video:"https://www.w3schools.com/html/mov_bbb.mp4",specs:{"HP":"1000"},link:"https://ferrari.com"},
mclaren:{name:"McLaren 720S",img:"https://images.unsplash.com/photo-1590362891991-f776e747a588",desc:"720HP",video:"https://www.w3schools.com/html/movie.mp4",specs:{"HP":"720"},link:"https://mclaren.com"},
koenigsegg:{name:"Jesko",img:"https://news.dupontregistry.com/cdn/shop/articles/Snapinsta.app_424480670_1773512393162429_5623901643462568802_n_1080.jpg?v=1767071160",desc:"1600HP",video:"https://www.w3schools.com/html/mov_bbb.mp4",specs:{"HP":"1600"},link:"https://koenigsegg.com"},
porsche:{name:"Porsche 911",img:"https://images.unsplash.com/photo-1583121274602-3e2820c69888",desc:"640HP",video:"https://www.w3schools.com/html/movie.mp4",specs:{"HP":"640"},link:"https://porsche.com"}
};

function openDetail(id){
let car=data[id];
dImg.src=car.img;
dName.innerText=car.name;
dDesc.innerText=car.desc;
dVideo.src=car.video;

let html="";
for(let k in car.specs){
html+=`<div class="spec">${k}: ${car.specs[k]}</div>`;
}
specs.innerHTML=html;

buyLink.href=car.link;

home.style.display="none";
carTab.style.display="none";
motorTab.style.display="none";
detailPage.style.display="block";
}

function goHome(){
home.style.display="flex";
carTab.style.display="block";
detailPage.style.display="none";
}
</script>

</body>
</html>
